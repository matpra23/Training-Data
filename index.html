<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoryzacja udana</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify_content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 90%;
        }
        h1 { color: #FC4C02; } /* Kolor Stravy */
        p { font-size: 18px; line-height: 1.6; }
        .instrukcja {
            background-color: #e8f0fe;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #b3d7ff;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Udało się!</h1>
        <p>Twoje konto Strava zostało pomyślnie połączone.</p>
        
        <div class="instrukcja">
            👇 WAŻNE: 👇<br>
            Skopiuj CAŁY adres tej strony (link z paska na górze)<br>
            i wyślij go swojemu trenerowi.
        </div>
    </div>
</body>
</html>
